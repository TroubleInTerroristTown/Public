name: Materialliste Android-App bauen

on:
  push:
    paths:
      - 'zimmerer-holzliste/**'
      - '.github/workflows/holzliste-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zimmerer-holzliste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME); setup-android@v3 scheitert dort an „sdkmanager tools“
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Tests + Screenshots
        continue-on-error: true
        run: gradle testReleaseUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: zimmerer-holzliste/app/build/screenshots/

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Materialliste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Materialliste-APK
          path: zimmerer-holzliste/Materialliste.apk

      - name: Als Release veröffentlichen (Download direkt am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: materialliste-v2.0.${{ github.run_number }}
          name: Materialliste App 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: zimmerer-holzliste/Materialliste.apk
          body: |
            Android-App „Materialliste“ (früher „Holzliste“) für Holz, Platten und Baustoffe.
            Installation: Materialliste.apk am Handy herunterladen und öffnen
            (ggf. „Installation aus unbekannten Quellen“ für den Browser erlauben).
            Installiert sich über die alte Holzliste – alle Listen und Kataloge bleiben erhalten.
