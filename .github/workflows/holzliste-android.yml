name: Holzliste Android-App bauen

on:
  push:
    paths:
      - 'zimmerer-holzliste/**'
      - '.github/workflows/holzliste-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zimmerer-holzliste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Holzliste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Holzliste-APK
          path: zimmerer-holzliste/Holzliste.apk

      - name: Als Release veröffentlichen (Download direkt am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: holzliste-v1.0.${{ github.run_number }}
          name: Holzliste App 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: zimmerer-holzliste/Holzliste.apk
          body: |
            Android-App „Holzliste“ für Zimmerer.
            Installation: Holzliste.apk am Handy herunterladen und öffnen
            (ggf. „Installation aus unbekannten Quellen“ für den Browser erlauben).
